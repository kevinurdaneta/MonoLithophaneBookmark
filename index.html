<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lithophane Bookmark Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { customTeal: '#1EE5EB', customGray: '#292929', customBlack: '#000000' } } }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-customBlack text-white h-screen flex overflow-hidden font-sans">

  <div id="viewport" class="flex-1 relative cursor-crosshair">
    <div class="absolute top-4 left-4 flex gap-2">
      <button id="toggleLightBtn" class="bg-customGray hover:bg-gray-700 text-white px-3 py-1 rounded text-sm border border-gray-600 shadow">
        Toggle Backlight View
      </button>
    </div>
  </div>

  <div id="sidebar" class="w-[340px] bg-customGray p-5 flex flex-col gap-4 overflow-y-auto border-l border-gray-700 shadow-xl">
    
    <div>
      <h2 class="text-xl font-bold tracking-wide text-customTeal mb-1">Bookmark Maker</h2>
      <p class="text-xs text-gray-400">Banned Books Week Workshop</p>
    </div>

    <!-- Image Setup -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">1. Image Source</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-700 file:text-customTeal hover:file:bg-gray-600 cursor-pointer" />
      <select id="imageMode" class="w-full bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mt-1">
        <option value="fit">Mode: Fit (White Borders)</option>
        <option value="fill">Mode: Fill (Crop to Edge)</option>
      </select>
    </div>

    <!-- Text Overlay -->
    <div class="space-y-2 bg-customBlack p-3 rounded border border-gray-700">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">Text Overlay</label>
      <input type="text" id="customText" placeholder="Enter custom text..." class="w-full bg-customGray border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mb-2" />
      
      <select id="fontFamily" class="w-full bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mb-2">
        <option value="sans-serif">Sans-Serif</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monospace</option>
      </select>

      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text Size</span><span id="textSizeVal">40</span></div>
        <input type="range" id="textSize" min="10" max="150" step="1" value="40" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text X Offset</span><span id="textXVal">0</span></div>
        <input type="range" id="textOffsetX" min="-300" max="300" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text Y Offset</span><span id="textYVal">0</span></div>
        <input type="range" id="textOffsetY" min="-300" max="300" step="1" value="0" class="w-full accent-customTeal">
      </div>
    </div>

    <!-- Transform & Contrast -->
    <div class="space-y-3 bg-customBlack p-3 rounded border border-gray-700">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">Image Adjustments</label>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Scale</span><span id="scaleVal">1.0</span></div>
        <input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Offset X</span><span id="xVal">0</span></div>
        <input type="range" id="imgOffsetX" min="-100" max="100" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Offset Y</span><span id="yVal">0</span></div>
        <input type="range" id="imgOffsetY" min="-100" max="100" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1 mt-2">
        <div class="flex justify-between text-xs text-customTeal"><span>Midpoint (Contrast)</span><span id="midVal">1.0</span></div>
        <input type="range" id="imgMidpoint" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-customTeal">
      </div>
      <div class="flex items-center gap-2 mt-2">
        <input type="checkbox" id="invertCheck" class="accent-customTeal w-4 h-4 cursor-pointer">
        <label for="invertCheck" class="text-xs cursor-pointer">Invert Image (Negative)</label>
      </div>
    </div>

    <!-- Print Settings -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">2. Print Settings (mm)</label>
      <div class="grid grid-cols-2 gap-2">
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Width</span><input type="number" id="bmWidth" value="138" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Height</span><input type="number" id="bmHeight" value="46" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Min Z (White)</span><input type="number" id="minThick" value="0.6" step="0.1" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Max Z (Black)</span><input type="number" id="maxThick" value="1.8" step="0.1" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
      </div>
    </div>

    <!-- Export -->
    <div class="mt-auto pt-2">
      <button id="exportBtn" class="w-full bg-customTeal hover:bg-teal-400 text-black font-bold py-3 px-4 rounded transition-colors shadow-lg">
        Export Solid STL
      </button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';

    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#000000');

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -100, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    
    const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);
    scene.add(new THREE.AxesHelper(50));

    scene.add(new THREE.AmbientLight(0x333333));
    const frontLight = new THREE.DirectionalLight(0xffffff, 1.5);
    frontLight.position.set(50, 50, 100); 
    scene.add(frontLight);

    const backLight = new THREE.PointLight(0xffaa55, 0, 200);
    backLight.position.set(0, 0, -50);
    scene.add(backLight);

    let lightActive = false;
    let material = new THREE.MeshStandardMaterial({ 
      color: 0xffffff, 
      roughness: 0.5,
      transparent: true,
      opacity: 1.0
    });

    document.getElementById('toggleLightBtn').addEventListener('click', () => {
      lightActive = !lightActive;
      backLight.intensity = lightActive ? 5 : 0;
      frontLight.intensity = lightActive ? 0.2 : 1.5; 
      material.opacity = lightActive ? 0.85 : 1.0; 
    });

    let currentImage = new Image();
    let currentMesh = null;

    currentImage.onload = () => updateMesh();
    currentImage.onerror = () => {
      console.warn("Could not load default image. Local CORS issue. Use a local server or GitHub Pages.");
    };
    currentImage.src = 'CensorshipIsSo1984-bookmark-main-single.png'; 

    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { currentImage.src = event.target.result; };
      reader.readAsDataURL(file);
    });

    const rangeInputs = ['imgScale', 'imgOffsetX', 'imgOffsetY', 'imgMidpoint', 'textSize', 'textOffsetX', 'textOffsetY'];
    rangeInputs.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', (e) => {
        if(id === 'imgScale') document.getElementById('scaleVal').innerText = e.target.value;
        if(id === 'imgOffsetX') document.getElementById('xVal').innerText = e.target.value;
        if(id === 'imgOffsetY') document.getElementById('yVal').innerText = e.target.value;
        if(id === 'imgMidpoint') document.getElementById('midVal').innerText = e.target.value;
        if(id === 'textSize') document.getElementById('textSizeVal').innerText = e.target.value;
        if(id === 'textOffsetX') document.getElementById('textXVal').innerText = e.target.value;
        if(id === 'textOffsetY') document.getElementById('textYVal').innerText = e.target.value;
      });
      el.addEventListener('change', () => updateMesh());
    });

    const standardInputs = ['bmWidth', 'bmHeight', 'minThick', 'maxThick', 'invertCheck', 'imageMode', 'customText', 'fontFamily'];
    standardInputs.forEach(id => {
      document.getElementById(id).addEventListener('change', () => updateMesh());
    });
    
    document.getElementById('customText').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') updateMesh();
    });

    function updateMesh() {
      if (!currentImage.complete || currentImage.naturalWidth === 0) return;
      if (currentMesh) scene.remove(currentMesh);

      const width = parseFloat(document.getElementById('bmWidth').value);
      const height = parseFloat(document.getElementById('bmHeight').value);
      const minZ = parseFloat(document.getElementById('minThick').value);
      const maxZ = parseFloat(document.getElementById('maxThick').value);
      const scale = parseFloat(document.getElementById('imgScale').value);
      const offsetX = parseFloat(document.getElementById('imgOffsetX').value);
      const offsetY = parseFloat(document.getElementById('imgOffsetY').value);
      const gamma = parseFloat(document.getElementById('imgMidpoint').value);
      const invert = document.getElementById('invertCheck').checked;
      const mode = document.getElementById('imageMode').value;
      
      const customText = document.getElementById('customText').value;
      const textSize = parseFloat(document.getElementById('textSize').value);
      const textOffsetX = parseFloat(document.getElementById('textOffsetX').value);
      const textOffsetY = parseFloat(document.getElementById('textOffsetY').value);
      const fontFamily = document.getElementById('fontFamily').value;

      const resX = Math.round(width * 2);
      const resY = Math.round(height * 2);

      const canvas = document.createElement('canvas');
      canvas.width = resX;
      canvas.height = resY;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, resX, resY);

      ctx.save();
      ctx.translate(resX / 2 + offsetX, resY / 2 + offsetY);
      ctx.scale(scale, scale);
      
      const imgAspect = currentImage.naturalWidth / currentImage.naturalHeight;
      const canvasAspect = resX / resY;
      let drawW, drawH;

      if (mode === 'fit') {
        if (imgAspect > canvasAspect) { drawW = resX; drawH = resX / imgAspect; } 
        else { drawH = resY; drawW = resY * imgAspect; }
      } else {
        if (imgAspect > canvasAspect) { drawH = resY; drawW = resY * imgAspect; } 
        else { drawW = resX; drawH = resX / imgAspect; }
      }
      
      ctx.drawImage(currentImage, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();

      if (customText.trim() !== '') {
        ctx.fillStyle = invert ? '#ffffff' : '#000000'; 
        ctx.font = `bold ${textSize}px ${fontFamily}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(customText, (resX / 2) + textOffsetX, (resY / 2) + textOffsetY);
      }

      const imgData = ctx.getImageData(0, 0, resX, resY).data;
      const geometry = new THREE.BoxGeometry(width, height, maxZ, resX - 1, resY - 1, 1);
      const pos = geometry.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        if (pos.getZ(i) > 0) {
            const px = Math.round((pos.getX(i) + width / 2) / width * (resX - 1));
            const py = Math.round((-pos.getY(i) + height / 2) / height * (resY - 1));
            const pxIdx = (py * resX + px) * 4;
            
            const r = imgData[pxIdx] !== undefined ? imgData[pxIdx] : 255;
            const g = imgData[pxIdx + 1] !== undefined ? imgData[pxIdx + 1] : 255;
            const b = imgData[pxIdx + 2] !== undefined ? imgData[pxIdx + 2] : 255;
            
            let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            if (invert) lum = 1.0 - lum;
            lum = Math.pow(lum, gamma);
            
            const z = maxZ - lum * (maxZ - minZ);
            pos.setZ(i, z);
        } else {
            pos.setZ(i, 0);
        }
      }

      geometry.computeVertexNormals();
      currentMesh = new THREE.Mesh(geometry, material);
      currentMesh.position.z = 0; 
      scene.add(currentMesh);
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!currentMesh) return;
      
      const firstName = prompt("Please enter your first name:");
      if (!firstName || firstName.trim() === "") return; 
      
      const age = prompt("Please enter your age:");
      if (!age || age.trim() === "") return; 

      const fileName = `${firstName.trim()}_${age.trim()}.stl`;

      const exporter = new STLExporter();
      const result = exporter.parse(currentMesh, { binary: true });
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
