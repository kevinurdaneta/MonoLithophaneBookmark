<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lithophane Bookmark Generator</title>
  <style>
    body { font-family: sans-serif; display: flex; margin: 0; height: 100vh; background: #1a1a1a; color: #fff; }
    #sidebar { width: 320px; padding: 20px; box-sizing: border-box; background: #252525; display: flex; flex-direction: column; gap: 15px; }
    #viewport { flex: 1; position: relative; }
    label { font-size: 13px; font-weight: bold; }
    input, button { padding: 8px; border-radius: 4px; border: none; }
    button { background: #0077ff; color: #fff; cursor: pointer; font-weight: bold; }
    button:hover { background: #005fcc; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="sidebar">
    <h2>Bookmark Maker</h2>
    <label>1. Select Image</label>
    <input type="file" id="imageInput" accept="image/*" />

    <label>2. Bookmark Dimensions (mm)</label>
    <div>Width: <input type="number" id="bmWidth" value="45" style="width: 50px;"> mm</div>
    <div>Height: <input type="number" id="bmHeight" value="135" style="width: 50px;"> mm</div>

    <label>3. Lithophane Thickness</label>
    <div>Min (Light): <input type="number" id="minThick" value="0.8" step="0.1" style="width: 50px;"> mm</div>
    <div>Max (Dark): <input type="number" id="maxThick" value="2.4" step="0.1" style="width: 50px;"> mm</div>

    <button id="exportBtn">Download Slicer-Ready STL</button>
  </div>
  <div id="viewport"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';

    // 1. Scene Setup
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1e1e1e);

    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -100, 150);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    const light = new THREE.DirectionalLight(0xffffff, 1.5);
    light.position.set(0, 0, 50);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x555555));

    let currentMesh = null;

    // 2. Image Processing & Mesh Generation
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => generateLithophane(img);
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function generateLithophane(image) {
      if (currentMesh) scene.remove(currentMesh);

      const width = parseFloat(document.getElementById('bmWidth').value);
      const height = parseFloat(document.getElementById('bmHeight').value);
      const minZ = parseFloat(document.getElementById('minThick').value);
      const maxZ = parseFloat(document.getElementById('maxThick').value);

      // Downsample grid resolution (1 grid point per mm)
      const resX = Math.round(width * 2);
      const resY = Math.round(height * 2);

      const canvas = document.createElement('canvas');
      canvas.width = resX;
      canvas.height = resY;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(image, 0, 0, resX, resY);
      const imgData = ctx.getImageData(0, 0, resX, resY).data;

      // Construct displaced PlaneGeometry
      const geometry = new THREE.PlaneGeometry(width, height, resX - 1, resY - 1);
      const pos = geometry.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        const pxIdx = i * 4;
        const r = imgData[pxIdx];
        const g = imgData[pxIdx + 1];
        const b = imgData[pxIdx + 2];
        
        // Luminance calculation
        const lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        // Invert luminance: Darker = thicker
        const z = maxZ - lum * (maxZ - minZ);
        pos.setZ(i, z);
      }

      geometry.computeVertexNormals();
      const material = new THREE.MeshStandardMaterial({ 
        color: 0xefefef, 
        roughness: 0.5,
        side: THREE.DoubleSide 
      });

      currentMesh = new THREE.Mesh(geometry, material);
      scene.add(currentMesh);
    }

    // 3. Export to STL
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!currentMesh) return alert('Upload an image first.');
      const exporter = new STLExporter();
      const result = exporter.parse(currentMesh, { binary: true });
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'banned_book_bookmark.stl';
      link.click();
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
