<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lithophane Bookmark Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { customTeal: '#1EE5EB', customGray: '#292929', customBlack: '#000000' } } }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-customBlack text-white h-screen flex overflow-hidden font-sans">

  <div id="viewport" class="flex-1 relative cursor-crosshair">
    <div class="absolute top-4 left-4 flex gap-2">
      <button id="toggleLightBtn" class="bg-customGray hover:bg-gray-700 text-white px-3 py-1 rounded text-sm border border-gray-600 shadow">
        Toggle Backlight View
      </button>
    </div>
  </div>

  <div id="sidebar" class="w-[340px] bg-customGray p-5 flex flex-col gap-4 overflow-y-auto border-l border-gray-700 shadow-xl">
    
    <div>
      <h2 class="text-xl font-bold tracking-wide text-customTeal mb-1">Bookmark Maker</h2>
      <p class="text-xs text-gray-400">Banned Books Week Workshop</p>
    </div>

    <!-- Image Setup -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">1. Image Source</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-gray-700 file:text-customTeal hover:file:bg-gray-600 cursor-pointer" />
      <select id="imageMode" class="w-full bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mt-1">
        <option value="fit">Mode: Fit (White Borders)</option>
        <option value="fill">Mode: Fill (Crop to Edge)</option>
      </select>
    </div>

    <!-- Text Overlay -->
    <div class="space-y-2 bg-customBlack p-3 rounded border border-gray-700">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">Text Overlay</label>
      <input type="text" id="customText" placeholder="Enter custom text..." class="w-full bg-customGray border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mb-2" />
      
      <select id="fontFamily" class="w-full bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm focus:border-customTeal outline-none mb-2">
        <option value="sans-serif">Sans-Serif</option>
        <option value="serif">Serif</option>
        <option value="monospace">Monospace</option>
      </select>

      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text Size</span><span id="textSizeVal">40</span></div>
        <input type="range" id="textSize" min="10" max="150" step="1" value="40" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text X Offset</span><span id="textXVal">0</span></div>
        <input type="range" id="textOffsetX" min="-300" max="300" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Text Y Offset</span><span id="textYVal">0</span></div>
        <input type="range" id="textOffsetY" min="-300" max="300" step="1" value="0" class="w-full accent-customTeal">
      </div>
    </div>

    <!-- Transform & Contrast -->
    <div class="space-y-3 bg-customBlack p-3 rounded border border-gray-700">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">Image Adjustments</label>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Scale</span><span id="scaleVal">1.0</span></div>
        <input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Offset X</span><span id="xVal">0</span></div>
        <input type="range" id="imgOffsetX" min="-100" max="100" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1">
        <div class="flex justify-between text-xs"><span>Offset Y</span><span id="yVal">0</span></div>
        <input type="range" id="imgOffsetY" min="-100" max="100" step="1" value="0" class="w-full accent-customTeal">
      </div>
      <div class="flex flex-col gap-1 mt-2">
        <div class="flex justify-between text-xs text-customTeal"><span>Midpoint (Contrast)</span><span id="midVal">1.0</span></div>
        <input type="range" id="imgMidpoint" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full accent-customTeal">
      </div>
      <div class="flex items-center gap-2 mt-2">
        <input type="checkbox" id="invertCheck" class="accent-customTeal w-4 h-4 cursor-pointer">
        <label for="invertCheck" class="text-xs cursor-pointer">Invert Image (Negative)</label>
      </div>
    </div>

    <!-- Print Settings -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">2. Print Settings (mm)</label>
      <div class="grid grid-cols-2 gap-2">
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Width</span><input type="number" id="bmWidth" value="138" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Height</span><input type="number" id="bmHeight" value="46" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Min Z (White)</span><input type="number" id="minThick" value="0.6" step="0.1" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-400">Max Z (Black)</span><input type="number" id="maxThick" value="1.8" step="0.1" class="bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:border-customTeal outline-none" /></div>
      </div>
    </div>
