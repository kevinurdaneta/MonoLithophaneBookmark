<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lithophane Bookmark Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            customTeal: '#1EE5EB',
            customGray: '#292929',
            customBlack: '#000000',
          }
        }
      }
    }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-customBlack text-white h-screen flex overflow-hidden font-sans">

  <!-- 3D Viewport -->
  <div id="viewport" class="flex-1 relative cursor-crosshair">
    <!-- Viewport overlay controls (like BumpMesh) -->
    <div class="absolute top-4 left-4 flex gap-2">
      <button id="toggleLightBtn" class="bg-customGray hover:bg-gray-700 text-white px-3 py-1 rounded text-sm border border-gray-600">
        Toggle Backlight
      </button>
    </div>
  </div>

  <!-- Sidebar Control Panel -->
  <div id="sidebar" class="w-80 bg-customGray p-6 flex flex-col gap-6 overflow-y-auto border-l border-gray-700 shadow-xl">
    
    <div>
      <h2 class="text-xl font-bold tracking-wide text-customTeal mb-1">Bookmark Maker</h2>
      <p class="text-xs text-gray-400">Banned Book Week</p>
    </div>

    <!-- Image Setup -->
    <div class="space-y-2">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">1. Image Source</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-customTeal hover:file:bg-gray-600 cursor-pointer" />
    </div>

    <!-- Dimensions -->
    <div class="space-y-3">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">2. Dimensions</label>
      <div class="flex items-center justify-between">
        <span class="text-sm">Width (mm)</span>
        <input type="number" id="bmWidth" value="45" class="w-16 bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-customTeal" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm">Height (mm)</span>
        <input type="number" id="bmHeight" value="135" class="w-16 bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-customTeal" />
      </div>
    </div>

    <!-- Thickness -->
    <div class="space-y-3">
      <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300">3. Lithophane Depth</label>
      <div class="flex items-center justify-between">
        <span class="text-sm">Min / Light (mm)</span>
        <input type="number" id="minThick" value="0.8" step="0.1" class="w-16 bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-customTeal" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-sm">Max / Dark (mm)</span>
        <input type="number" id="maxThick" value="2.4" step="0.1" class="w-16 bg-customBlack border border-gray-600 rounded px-2 py-1 text-sm text-center focus:outline-none focus:border-customTeal" />
      </div>
    </div>

    <!-- Export -->
    <div class="mt-auto pt-4 border-t border-gray-700">
      <button id="exportBtn" class="w-full bg-customTeal hover:bg-teal-400 text-black font-bold py-3 px-4 rounded transition-colors shadow-lg">
        Export STL
      </button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Initialize Scene
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#000000'); // Custom Black

    // Camera & Renderer
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, -150, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);

    // Environment Helpers
    const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
    gridHelper.rotation.x = Math.PI / 2; // Align to XY plane
    scene.add(gridHelper);

    const axesHelper = new THREE.AxesHelper(50);
    scene.add(axesHelper);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040); 
    scene.add(ambientLight);
    
    const backLight = new THREE.PointLight(0xffffff, 2, 100);
    backLight.position.set(0, 0, -20); // Positioned behind the model
    scene.add(backLight);

    let lightActive = true;
    document.getElementById('toggleLightBtn').addEventListener('click', () => {
      lightActive = !lightActive;
      backLight.intensity = lightActive ? 2 : 0;
    });

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    // Render loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
