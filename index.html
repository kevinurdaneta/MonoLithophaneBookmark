<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lithophane Bookmark Maker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { customTeal: '#1EE5EB', customGray: '#292929', customBlack: '#000000' } } }
    }
  </script>
  <style>
    /* Skeuomorphic Scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #151515; box-shadow: inset 0 0 5px rgba(0,0,0,0.8); }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; border: 1px solid #444; box-shadow: inset 0 1px 1px rgba(255,255,255,0.2); }
    ::-webkit-scrollbar-thumb:hover { background: #444; }
    
    /* Tactile Range Sliders */
    input[type=range] {
      -webkit-appearance: none;
      background: #111;
      border-radius: 8px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.8), 0 1px 0 rgba(255,255,255,0.1);
      height: 8px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at top, #1EE5EB, #0d8c90);
      box-shadow: 0 2px 5px rgba(0,0,0,0.6), inset 0 1px 2px rgba(255,255,255,0.6);
      border: 1px solid #000;
      cursor: pointer;
    }
    
    /* Skeuomorphic Inputs */
    .inset-input {
      background-color: #1a1a1a;
      border: 1px solid #0a0a0a;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.6), 0 1px 0 rgba(255,255,255,0.08);
      color: #eaeaea;
    }
    
    /* Skeuomorphic Panels */
    .bevel-panel {
      background: linear-gradient(180deg, #333333 0%, #252525 100%);
      border: 1px solid #111;
      border-top: 1px solid #4a4a4a;
      box-shadow: 0 5px 10px rgba(0,0,0,0.5);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="bg-[#0a0a0a] text-white h-screen flex overflow-hidden font-sans">

  <!-- Viewport -->
  <div id="viewport" class="flex-1 relative cursor-crosshair bg-gradient-to-br from-[#1a1a1a] to-[#050505]">
    <div class="absolute top-5 left-5 flex gap-2">
      <button id="toggleLightBtn" class="bevel-panel hover:brightness-110 active:translate-y-[1px] active:shadow-inner text-gray-300 px-4 py-2 rounded-lg text-sm font-semibold transition-all">
        Toggle Backlight View
      </button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar" class="w-[360px] bg-gradient-to-b from-[#2d2d2d] to-[#1e1e1e] p-5 flex flex-col gap-5 overflow-y-auto border-l border-[#444] shadow-[-10px_0_20px_rgba(0,0,0,0.6)] z-10">
    
    <div class="mb-2">
      <h2 class="text-2xl font-extrabold tracking-wide text-transparent bg-clip-text bg-gradient-to-b from-[#1EE5EB] to-[#0d8c90] drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">Bookmark Maker</h2>
      <p class="text-xs text-gray-400 font-medium">Banned Books Week Workshop</p>
    </div>

    <!-- Image Setup -->
    <div class="space-y-3 bevel-panel p-4 rounded-xl">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 drop-shadow-md">1. Image Source</label>
      <input type="file" id="imageInput" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-gradient-to-b file:from-[#444] file:to-[#222] file:text-customTeal file:shadow-[0_2px_4px_rgba(0,0,0,0.6),inset_0_1px_1px_rgba(255,255,255,0.2)] hover:file:brightness-110 cursor-pointer" />
      <select id="imageMode" class="w-full inset-input rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-customTeal mt-2">
        <option value="fit">Fit (White Borders)</option>
        <option value="fill">Fill (Crop to Edge)</option>
      </select>
    </div>

    <!-- Transform & Contrast -->
    <div class="space-y-4 bevel-panel p-4 rounded-xl">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 drop-shadow-md">2. Image Adjustments</label>
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between text-xs font-medium text-gray-300"><span>Scale</span><span id="scaleVal">1.0</span></div>
        <input type="range" id="imgScale" min="0.1" max="3" step="0.1" value="1" class="w-full">
      </div>
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between text-xs font-medium text-gray-300"><span>Offset X</span><span id="xVal">0</span></div>
        <input type="range" id="imgOffsetX" min="-100" max="100" step="1" value="0" class="w-full">
      </div>
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between text-xs font-medium text-gray-300"><span>Offset Y</span><span id="yVal">0</span></div>
        <input type="range" id="imgOffsetY" min="-100" max="100" step="1" value="0" class="w-full">
      </div>
      <div class="flex flex-col gap-1.5 mt-3 pt-3 border-t border-[#111] shadow-[0_1px_0_rgba(255,255,255,0.05)]">
        <div class="flex justify-between text-xs font-bold text-customTeal"><span>Midpoint (Contrast)</span><span id="midVal">1.0</span></div>
        <input type="range" id="imgMidpoint" min="0.1" max="3.0" step="0.1" value="1.0" class="w-full">
      </div>
      <div class="flex items-center gap-3 pt-2">
        <input type="checkbox" id="invertCheck" class="w-4 h-4 cursor-pointer inset-input rounded accent-customTeal">
        <label for="invertCheck" class="text-xs font-medium text-gray-300 cursor-pointer">Invert Image (Negative)</label>
      </div>
    </div>

    <!-- Print Settings -->
    <div class="space-y-3 bevel-panel p-4 rounded-xl">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-gray-400 drop-shadow-md">3. Print Settings (mm)</label>
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col"><span class="text-[10px] text-gray-500 font-bold mb-1">Width</span><input type="number" id="bmWidth" value="138" class="inset-input rounded-md px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-1 focus:ring-customTeal" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-500 font-bold mb-1">Height</span><input type="number" id="bmHeight" value="46" class="inset-input rounded-md px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-1 focus:ring-customTeal" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-500 font-bold mb-1">Min Z (White)</span><input type="number" id="minThick" value="0.6" step="0.1" class="inset-input rounded-md px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-1 focus:ring-customTeal" /></div>
        <div class="flex flex-col"><span class="text-[10px] text-gray-500 font-bold mb-1">Max Z (Black)</span><input type="number" id="maxThick" value="1.8" step="0.1" class="inset-input rounded-md px-2 py-1.5 text-sm text-center focus:outline-none focus:ring-1 focus:ring-customTeal" /></div>
      </div>
    </div>

    <!-- Export -->
    <div class="mt-auto pt-4">
      <button id="exportBtn" class="w-full bg-gradient-to-b from-[#1EE5EB] to-[#0d8c90] hover:brightness-110 active:translate-y-[2px] active:shadow-[inset_0_3px_5px_rgba(0,0,0,0.4)] text-[#050505] font-extrabold text-sm py-4 px-4 rounded-xl border border-[#4cf5f9] shadow-[0_5px_15px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,0.7)] transition-all">
        EXPORT SOLID STL
      </button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { STLExporter } from 'three/addons/exporters/STLExporter.js';

    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    
    // Setting up the Camera with Z-axis as UP (Fixes orbit roll)
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.up.set(0, 0, 1);
    camera.position.set(0, -150, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    
    const gridHelper = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);
    scene.add(new THREE.AxesHelper(50));

    scene.add(new THREE.AmbientLight(0x333333));
    const frontLight = new THREE.DirectionalLight(0xffffff, 1.5);
    frontLight.position.set(50, 50, 100); 
    scene.add(frontLight);

    const backLight = new THREE.PointLight(0xffaa55, 0, 200);
    backLight.position.set(0, 0, -50);
    scene.add(backLight);

    let lightActive = false;
    let material = new THREE.MeshStandardMaterial({ 
      color: 0xffffff, 
      roughness: 0.5,
      transparent: true,
      opacity: 1.0
    });

    document.getElementById('toggleLightBtn').addEventListener('click', () => {
      lightActive = !lightActive;
      backLight.intensity = lightActive ? 5 : 0;
      frontLight.intensity = lightActive ? 0.2 : 1.5; 
      material.opacity = lightActive ? 0.85 : 1.0; 
    });

    let currentImage = new Image();
    let currentMesh = null;

    currentImage.onload = () => updateMesh();
    currentImage.onerror = () => {
      console.warn("Could not load default image. Local CORS issue. Use a local server or GitHub Pages.");
    };
    currentImage.src = 'CensorshipIsSo1984-bookmark-main-single.png'; 

    // Robust Image Upload Fix
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => { 
        const newImg = new Image();
        newImg.onload = () => {
          currentImage = newImg;
          updateMesh();
        };
        newImg.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    const rangeInputs = ['imgScale', 'imgOffsetX', 'imgOffsetY', 'imgMidpoint'];
    rangeInputs.forEach(id => {
      const el = document.getElementById(id);
      el.addEventListener('input', (e) => {
        if(id === 'imgScale') document.getElementById('scaleVal').innerText = e.target.value;
        if(id === 'imgOffsetX') document.getElementById('xVal').innerText = e.target.value;
        if(id === 'imgOffsetY') document.getElementById('yVal').innerText = e.target.value;
        if(id === 'imgMidpoint') document.getElementById('midVal').innerText = e.target.value;
      });
      el.addEventListener('change', () => updateMesh());
    });

    const standardInputs = ['bmWidth', 'bmHeight', 'minThick', 'maxThick', 'invertCheck', 'imageMode'];
    standardInputs.forEach(id => {
      document.getElementById(id).addEventListener('change', () => updateMesh());
    });
    
    function updateMesh() {
      if (!currentImage.complete || currentImage.naturalWidth === 0) return;
      if (currentMesh) scene.remove(currentMesh);

      const width = parseFloat(document.getElementById('bmWidth').value);
      const height = parseFloat(document.getElementById('bmHeight').value);
      const minZ = parseFloat(document.getElementById('minThick').value);
      const maxZ = parseFloat(document.getElementById('maxThick').value);
      const scale = parseFloat(document.getElementById('imgScale').value);
      const offsetX = parseFloat(document.getElementById('imgOffsetX').value);
      const offsetY = parseFloat(document.getElementById('imgOffsetY').value);
      const gamma = parseFloat(document.getElementById('imgMidpoint').value);
      const invert = document.getElementById('invertCheck').checked;
      const mode = document.getElementById('imageMode').value;

      const resX = Math.round(width * 2);
      const resY = Math.round(height * 2);

      const canvas = document.createElement('canvas');
      canvas.width = resX;
      canvas.height = resY;
      const ctx = canvas.getContext('2d');
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, resX, resY);

      ctx.save();
      ctx.translate(resX / 2 + offsetX, resY / 2 + offsetY);
      ctx.scale(scale, scale);
      
      const imgAspect = currentImage.naturalWidth / currentImage.naturalHeight;
      const canvasAspect = resX / resY;
      let drawW, drawH;

      if (mode === 'fit') {
        if (imgAspect > canvasAspect) { drawW = resX; drawH = resX / imgAspect; } 
        else { drawH = resY; drawW = resY * imgAspect; }
      } else {
        if (imgAspect > canvasAspect) { drawH = resY; drawW = resY * imgAspect; } 
        else { drawW = resX; drawH = resX / imgAspect; }
      }
      
      ctx.drawImage(currentImage, -drawW / 2, -drawH / 2, drawW, drawH);
      ctx.restore();

      const imgData = ctx.getImageData(0, 0, resX, resY).data;
      const geometry = new THREE.BoxGeometry(width, height, maxZ, resX - 1, resY - 1, 1);
      const pos = geometry.attributes.position;

      for (let i = 0; i < pos.count; i++) {
        if (pos.getZ(i) > 0) {
            const px = Math.round((pos.getX(i) + width / 2) / width * (resX - 1));
            const py = Math.round((-pos.getY(i) + height / 2) / height * (resY - 1));
            const pxIdx = (py * resX + px) * 4;
            
            const r = imgData[pxIdx] !== undefined ? imgData[pxIdx] : 255;
            const g = imgData[pxIdx + 1] !== undefined ? imgData[pxIdx + 1] : 255;
            const b = imgData[pxIdx + 2] !== undefined ? imgData[pxIdx + 2] : 255;
            
            let lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            if (invert) lum = 1.0 - lum;
            lum = Math.pow(lum, gamma);
            
            const z = maxZ - lum * (maxZ - minZ);
            pos.setZ(i, z);
        } else {
            pos.setZ(i, 0);
        }
      }

      geometry.computeVertexNormals();
      currentMesh = new THREE.Mesh(geometry, material);
      currentMesh.position.z = 0; 
      scene.add(currentMesh);
    }

    document.getElementById('exportBtn').addEventListener('click', () => {
      if (!currentMesh) return;
      
      const firstName = prompt("Please enter your first name:");
      if (!firstName || firstName.trim() === "") return; 
      
      const age = prompt("Please enter your age:");
      if (!age || age.trim() === "") return; 

      const fileName = `${firstName.trim()}_${age.trim()}.stl`;

      const exporter = new STLExporter();
      const result = exporter.parse(currentMesh, { binary: true });
      const blob = new Blob([result], { type: 'application/octet-stream' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.click();
    });

    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
